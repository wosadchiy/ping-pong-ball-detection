; PlatformIO project configuration — STM32 Nucleo-F103RB ball-tracker firmware.
;
; This is the replacement target for the Arduino Nano sketch
; `camera_control_v2/camera_control_v2.ino`. We start in `framework=arduino`
; (stm32duino core) so the existing Arduino-API sketch can be ported in small
; steps:
;
;   Step 1 (this commit): manual jog with two buttons. No timers, no Pi.
;   Step 2: bring back the timer-driven step-pulse generator with HardwareTimer.
;   Step 3: serial protocol from Pi (UART or SPI). Ramp control. Telemetry.
;
; Flashing on Pi 4:
;   Plug Nucleo into Pi's USB. ST-Link/V2-1 on the Nucleo board exposes itself
;   as both a USB mass-storage device (DnD-flashing) and an SWD probe. We use
;   the SWD probe via openocd → `task fw_flash`.
;
; ── BOARD HARDWARE GOTCHAS (read before debugging "dead board" symptoms) ────
;   * **Jumper JP5 selects the 5 V source** for the on-board LDO (U3) that
;     powers the target STM32 at 3.3 V. Both positions are valid, but the
;     pin you pick MUST actually carry 5 V — otherwise VTREF sags to ~2.5 V,
;     HSE won't start, openocd reports `Halt timed out`, and LD2 lights
;     dimly with no blink:
;       - `U5V` — 5 V from ST-Link USB. Use for a bare board with no load.
;       - `E5V` — 5 V from the CN7 pin 6 header. Use this when the motor
;                 driver / external 5 V supply is wired up: the Pi USB no
;                 longer sags under motor inrush, and ground loops through
;                 the USB shield don't couple into the motor rail.
;     If you set JP5=E5V but forgot to feed E5V → board appears dead.
;     We've been bitten by this once — check JP5 first when SWD fails.
;   * **JP1 (IDD) must have its jumper installed** — without it the target
;     MCU has no Vdd at all (the IDD jumper sits in series on the 3V3 rail
;     to allow current measurement; an open jumper means open Vdd).
;   * Run `task fw_diag` to query VTREF + RCC_CSR/CR/CFGR over SWD before
;     suspecting firmware bugs.
;
; Required PlatformIO platform packages will be auto-downloaded on first build.

[env:nucleo_f103rb]
platform   = ststm32
board      = nucleo_f103rb
framework  = arduino

; ST-Link/V2-1 is the on-board probe — same physical USB port as the VCP.
upload_protocol = stlink

; ── connect-under-reset ─────────────────────────────────────────────────────
; This board (MB1136 rev C-04) refuses warm SWD examination — every cold flash
; is "Error: init mode failed" without forcing NRST low during connect. With
; this flag set the upload sequence works:
;   1. ST-Link drives NRST low
;   2. SWD examines the halted core, programs flash, verifies
;   3. ST-Link releases NRST → "Resetting Target" → "Error 1"
;
; The trailing "Error 1" is harmless openocd noise on srst-release — at this
; point firmware is ALREADY written and verified ("** Verified OK **"). After
; the upload finishes, press the **B2/RESET** button on the board to actually
; start the freshly written firmware (or open `task fw_serial` first, then
; press RESET — the new banner will appear immediately).
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst

; Serial monitor: Nucleo's ST-Link bridges USART2 (PA2/PA3 by default in
; stm32duino) to /dev/ttyACM0 on Linux. So `Serial.println(...)` in the sketch
; lands in `pio device monitor` directly, no extra wiring.
monitor_speed = 115200

; -O2: smaller / faster than the default -Os for AVR-style int-heavy code.
; -DUSE_FULL_LL_DRIVER would pull in LL — we don't need it for Arduino-core.
build_flags =
    -O2
    -DARDUINO_NUCLEO_F103RB

; Disable the LSE-warning the linker emits for boards without external 32 kHz
; xtal (Nucleo-F103RB does have one but the default startup file pings the
; HSE on the warning path — harmless, but noisy).
build_unflags =
    -Os
